  <style>
    :root {
      --text: #fff;
      --text-muted: rgba(255, 255, 255, 0.68);
      --border: rgba(255, 255, 255, 0.28);
      --glass: rgba(255, 255, 255, 0.11);
      --glass-hover: rgba(255, 255, 255, 0.18);

      --radius: 18px;
      --page-padding: clamp(22px, 5vw, 72px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;

      font-family: "Geologica", sans-serif;
      font-weight: 300;
      color: var(--text);

      background: #9c9c9a;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

	/* =========================================================
	   BACKGROUND
	========================================================= */

	.page {
	  position: relative;
	  min-height: 100svh;
	  isolation: isolate;
	  overflow: hidden;

	  display: flex;
	  align-items: stretch;
	}

	/* Основная фотография */
	.page::before {
	  content: "";
	  position: absolute;
	  z-index: -3;
	  inset: 0;

	  background:
	    linear-gradient(
	      90deg,
	      rgba(20, 20, 18, 0.38) 0%,
	      rgba(20, 20, 18, 0.08) 52%,
	      rgba(20, 20, 18, 0.18) 100%
	    ),
	    url("./assets/bg.webp") right 32% / cover no-repeat;
	}

	/* Размытая копия фотографии */
	.page::after {
	  content: "";
	  position: absolute;
	  z-index: -2;
	  inset: -40px;

	  background:
	    url("./assets/bg.webp") right 32% / cover no-repeat;

	  filter: blur(35px);
	  opacity: 0.22;
	  transform: scale(1.04);
	}

    /* =========================================================
       LAYOUT
    ========================================================= */

    .content {
      width: 100%;
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      padding:
        max(28px, env(safe-area-inset-top))
        var(--page-padding)
        max(28px, env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      justify-content: center;
      align-items: flex-start;
	  margin-bottom: max(24px, env(safe-area-inset-top));
    }

    .logo {
      display: block;

      width: clamp(110px, 12vw, 170px);
      height: auto;

      filter:
        brightness(0)
        invert(1);

      opacity: 0.92;
    }

    /* =========================================================
       CENTER
    ========================================================= */

    .center {
      display: flex;
      flex-direction: column;
      width: min(520px, 100%);      
      padding-bottom: 40px;
      margin-top: auto;
    }

    .eyebrow {
      margin: 0 auto 22px;

      font-size: 11px;
      line-height: 1.3;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;

      color: var(--text-muted);
    }

    .title {
      max-width: 470px;

      font-size: clamp(34px, 4.8vw, 68px);
      line-height: 0.98;
      font-weight: 300;
      letter-spacing: -0.045em;
    }

    .description {
      max-width: 370px;

      margin-top: 24px;

      font-size: clamp(13px, 1.2vw, 15px);
      line-height: 1.55;
      font-weight: 300;

      color: rgba(255, 255, 255, 0.76);
    }

    /* =========================================================
       LINKS
    ========================================================= */

    .links {
      width: min(520px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .link {
      position: relative;

      min-height: 66px;

      display: flex;
      align-items: center;
      gap: 15px;

      padding: 15px 18px;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      background: var(--glass);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        background 220ms ease,
        border-color 220ms ease,
        transform 220ms ease;
    }

    .link:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.48);

      transform: translateY(-2px);
    }

    .link:active {
      transform: scale(0.985);
    }

    .link_full-width {
      grid-column: span 2 / span 2;
    }

    .icon {
      width: 23px;
      height: 23px;
      flex: 0 0 23px;

      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .link-content {
      min-width: 0;
    }

    .link-title {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .link-subtitle {
      margin-top: 5px;

      font-size: 12px;
      line-height: 1.2;
      font-weight: 300;

      color: rgba(255, 255, 255, 0.54);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-top: 28px;
    }

    .footer-note {
      font-size: 11px;
      line-height: 1.4;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.45);
    }

    .footer-number {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;

      color: rgba(255, 255, 255, 0.45);
    }

	/* =========================================================
	   MOBILE
	========================================================= */

	@media (max-width: 650px) {
    .center {
      height: 100%;
      margin-top: unset;
    }

	  .page::before {
	    background:
	      linear-gradient(
	        180deg,
	        rgba(20, 20, 18, 0.10) 0%,
	        rgba(20, 20, 18, 0.08) 35%,
	        rgba(20, 20, 18, 0.48) 100%
	      ),
	      url("./assets/bg.webp") center center / cover no-repeat;
	  }

	  .page::after {
	    background:
	      url("./assets/bg.webp") center center / cover no-repeat;

	    opacity: 0.32;
	    filter: blur(28px);
	  }

	  .content {
	    padding:
	      max(24px, env(safe-area-inset-top))
	      18px
	      max(20px, env(safe-area-inset-bottom));
	  }

	  .top-label {
	    display: none;
	  }

	  .logo {
	    width: 130px;
	  }

	  .eyebrow {
	    margin-bottom: 16px;
	    font-size: 11px;
	  }

	  .title {
	    font-size: clamp(30px, 10vw, 52px);
	    line-height: 1;
	  }

	  .description {
	    max-width: 290px;
	    margin-top: auto;

	    font-size: 16px;
	    line-height: 1.5;
	  }

	  .links {
      margin-top: auto;
	    grid-template-columns: 1fr;
	    gap: 8px;
	  }

	  .link {
	    min-height: 58px;
	    padding: 10px 12px;
	    border-radius: 12px;
	  }

    .link_full-width {
      grid-column: auto;
    }

	  .icon {
	    width: 21px;
	    height: 21px;
	    flex-basis: 21px;
	  }

	  .link-title {
	    font-size: 16px;
	  }

	  .link-subtitle {
	    font-size: 11px;
	  }

	  .footer {
	    display: none;
	  }
	}

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
